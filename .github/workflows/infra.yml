name: Infrastructure

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev
        required: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: infra-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  infra:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      ENV_NAME: ${{ inputs.environment || 'dev' }}
      AZURE_RG: ${{ vars.AZURE_RG }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Lint Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: What-if (dev)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          az deployment group what-if -g "$AZURE_RG" --parameters infra/env/dev.bicepparam 2>&1 \
            | sed 's/\x1b\[[0-9;]*m//g' | tee whatif.txt
          {
            echo "### Bicep what-if (dev)"
            echo
            echo '```'
            head -c 60000 whatif.txt
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md --edit-last --create-if-none

      - name: Deploy
        if: github.event_name == 'workflow_dispatch'
        run: |
          az deployment group create -g "$AZURE_RG" --name "infra-${{ github.run_number }}" \
            --parameters "infra/env/${ENV_NAME}.bicepparam" -o none

      - name: Ensure session-secret
        if: github.event_name == 'workflow_dispatch'
        run: |
          KV=$(az keyvault list -g "$AZURE_RG" --query "[0].name" -o tsv)
          # Retry while a freshly created Key Vault role assignment propagates.
          for attempt in 1 2 3 4 5 6; do
            if az keyvault secret show --vault-name "$KV" -n session-secret -o none 2>/dev/null; then
              echo "session-secret exists"; exit 0
            fi
            if az keyvault secret set --vault-name "$KV" -n session-secret \
                 --value "$(openssl rand -base64 48)" -o none 2>/dev/null; then
              echo "session-secret created"; exit 0
            fi
            echo "Key Vault not writable yet (attempt $attempt); waiting"
            sleep 30
          done
          exit 1

      - name: Deployment outputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "### Deployment outputs (${ENV_NAME})"
            echo '```json'
            az deployment group show -g "$AZURE_RG" --name "infra-${{ github.run_number }}" \
              --query properties.outputs -o json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
